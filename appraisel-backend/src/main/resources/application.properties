spring.application.name=appraisel

# Database: set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in Render
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway has no migration files in this project, so keep it off
spring.flyway.enabled=false

# Render supplies PORT; falls back to 9090 locally
server.port=${PORT:9090}

# Mail: set SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD in Render
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true